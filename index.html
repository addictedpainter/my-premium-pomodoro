<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Pomodoro - Focus & Flow</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --bg-color: #0c0c0e;
            --card-bg: rgba(255, 255, 255, 0.03);
            --pomodoro-red: #ff4d4d;
            --short-break: #4dffb5;
            --long-break: #4da6ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent: var(--pomodoro-red);
            --accent-glow: rgba(255, 77, 77, 0.3);
            --modal-bg: rgba(0, 0, 0, 0.85);
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-primary: #1a1a1e;
            --text-secondary: rgba(0, 0, 0, 0.6);
            --modal-bg: rgba(255, 255, 255, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-image, none);
            background-size: cover;
            background-position: center;
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Overlay for background images to maintain legibility */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, var(--bg-overlay, 0));
            z-index: -2;
            transition: background 0.5s ease;
        }

        .background-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), var(--accent-transparent, rgba(255, 77, 77, 0.1)) 0%, transparent 60%);
            z-index: -1;
            transition: background 0.8s ease;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            text-align: center;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 3rem;
            padding: 3.5rem 2.5rem 2.5rem;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modes {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 3.5rem;
            background: rgba(0, 0, 0, 0.05);
            padding: 0.5rem;
            border-radius: 1.5rem;
            border: 1px solid var(--glass-border);
        }

        [data-theme="dark"] .modes {
            background: rgba(255, 255, 255, 0.02);
        }

        .mode-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 0.7rem 1.2rem;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(5px);
        }

        .mode-btn.active {
            background: var(--glass-bg);
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .timer-display {
            font-size: 7.5rem;
            font-weight: 800;
            letter-spacing: -4px;
            margin-bottom: 2.5rem;
            user-select: none;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            opacity: 0.9;
            /* Glassmorphism for text */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1), 0 0 20px var(--accent-glow);
            filter: drop-shadow(0px 4px 4px rgba(0, 0, 0, 0.05));
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .btn {
            background: var(--glass-bg);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            padding: 1.2rem 3rem;
            border-radius: 1.8rem;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            transform: translateY(-3px);
            background: var(--glass-border);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .btn-icon {
            background: var(--glass-bg);
            color: var(--text-primary);
            width: 3.8rem;
            height: 3.8rem;
            border-radius: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-icon:hover {
            transform: scale(1.1);
            background: var(--glass-border);
            border-color: var(--accent);
            color: var(--accent);
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 2rem;
            border: 1px solid var(--glass-border);
        }

        [data-theme="dark"] .progress-container {
            background: rgba(255, 255, 255, 0.02);
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 1s linear;
            box-shadow: 0 0 15px var(--accent);
        }

        .footer-text {
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            opacity: 0.5;
            text-transform: uppercase;
        }

        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .settings-card {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            padding: 3rem;
            border-radius: 2.5rem;
            width: 90%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .setting-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .setting-group label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .setting-group input,
        .setting-group select {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0.6rem;
            border-radius: 0.8rem;
            font-family: inherit;
            font-weight: 600;
        }

        .setting-group input[type="number"] {
            width: 70px;
            text-align: center;
        }

        .setting-group input[type="text"] {
            flex: 1;
        }

        .theme-toggle {
            position: fixed;
            bottom: 2.5rem;
            right: 2.5rem;
            z-index: 50;
        }

        /* Responsive adjustments */
        @media (max-width: 500px) {
            .timer-display {
                font-size: 5rem;
            }

            .btn {
                padding: 1rem 2rem;
                font-size: 0.9rem;
            }

            .glass-card {
                padding: 2.5rem 1.5rem 1.5rem;
            }
        }
    </style>
</head>

<body data-theme="dark">
    <div class="background-gradient" id="bg-gradient"></div>

    <div class="container">
        <div class="glass-card">
            <div class="modes">
                <button class="mode-btn active" id="mode-pomodoro" onclick="setMode('pomodoro')">Focus</button>
                <button class="mode-btn" id="mode-short" onclick="setMode('shortBreak')">Short Break</button>
                <button class="mode-btn" id="mode-long" onclick="setMode('longBreak')">Long Break</button>
            </div>

            <div class="timer-display" id="timer">25:00</div>

            <div class="controls">
                <button class="btn" id="start-btn" onclick="toggleTimer()">START</button>
                <button class="btn-icon" onclick="resetTimer()">
                    <i data-lucide="rotate-ccw"></i>
                </button>
                <button class="btn-icon" onclick="toggleSettings()">
                    <i data-lucide="settings"></i>
                </button>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>

            <div class="footer-text">made by kimko</div>
        </div>
    </div>

    <button class="btn-icon theme-toggle" onclick="toggleTheme()" id="theme-btn">
        <i data-lucide="sun"></i>
    </button>

    <div class="settings-overlay" id="settings-overlay">
        <div class="settings-card">
            <h2 style="margin-bottom: 2rem; font-weight: 800;">Settings</h2>

            <div style="margin-bottom: 2rem;">
                <h3
                    style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem; text-transform: uppercase;">
                    Durations</h3>
                <div class="setting-group">
                    <label>Focus (min)</label>
                    <input type="number" id="input-pomodoro" value="25">
                </div>
                <div class="setting-group">
                    <label>Short Break (min)</label>
                    <input type="number" id="input-short" value="5">
                </div>
                <div class="setting-group">
                    <label>Long Break (min)</label>
                    <input type="number" id="input-long" value="15">
                </div>
            </div>

            <div style="margin-bottom: 2rem;">
                <h3
                    style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem; text-transform: uppercase;">
                    Audio & Visual</h3>
                <div class="setting-group">
                    <label>End Sound</label>
                    <select id="select-sound">
                        <option value="bell">Digital Bell</option>
                        <option value="zen">Zen Gong</option>
                        <option value="pulse">Sci-Fi Pulse</option>
                        <option value="chirp">Bird Chirp</option>
                        <option value="classic">Classic Beep</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Background URL</label>
                    <input type="text" id="input-bg" placeholder="https://image-url.jpg">
                </div>
                <div class="setting-group">
                    <label>Overlay Intensity</label>
                    <input type="range" id="input-overlay" min="0" max="80" value="0" style="flex:1">
                </div>
            </div>

            <button class="btn" style="width: 100%; margin-top: 1rem;" onclick="saveSettings()">SAVE SETTINGS</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let timeLeft, timerId = null, currentMode = 'pomodoro';
        const settings = {
            pomodoro: 25,
            shortBreak: 5,
            longBreak: 15,
            sound: 'bell',
            bgImage: '',
            overlay: 0
        };
        const colors = { pomodoro: '#ff4d4d', shortBreak: '#4dffb5', longBreak: '#4da6ff' };

        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const progressBar = document.getElementById('progress');
        const bgGradient = document.getElementById('bg-gradient');
        const root = document.documentElement;

        function init() {
            loadSettings();
            timeLeft = settings[currentMode] * 60;
            updateDisplay();
            updateColors();
            loadTheme();
            applyVisualSettings();
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            document.title = `${timerDisplay.textContent} - Focus`;
            const total = settings[currentMode] * 60;
            progressBar.style.width = `${((total - timeLeft) / total) * 100}%`;
        }

        function toggleTimer() { timerId ? pauseTimer() : startTimer(); }
        function startTimer() { startBtn.textContent = 'PAUSE'; timerId = setInterval(() => { timeLeft--; updateDisplay(); if (timeLeft <= 0) complete(); }, 1000); }
        function pauseTimer() { clearInterval(timerId); timerId = null; startBtn.textContent = 'START'; }
        function resetTimer() { pauseTimer(); timeLeft = settings[currentMode] * 60; updateDisplay(); }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            const btnId = mode === 'pomodoro' ? 'mode-pomodoro' : mode === 'shortBreak' ? 'mode-short' : 'mode-long';
            document.getElementById(btnId).classList.add('active');
            updateColors();
            resetTimer();
        }

        function updateColors() {
            const color = colors[currentMode];
            root.style.setProperty('--accent', color);
            root.style.setProperty('--accent-glow', color + '4D');
            root.style.setProperty('--accent-transparent', color + '1A');
        }

        function complete() {
            pauseTimer();
            playSound();
            setTimeout(() => {
                alert(currentMode === 'pomodoro' ? 'Focus session complete! Time for a break.' : 'Break over! Ready to focus?');
                setMode(currentMode === 'pomodoro' ? 'shortBreak' : 'pomodoro');
            }, 100);
        }

        function playSound() {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const osc = context.createOscillator();
            const gain = context.createGain();

            osc.connect(gain);
            gain.connect(context.destination);

            const type = settings.sound;
            const now = context.currentTime;

            if (type === 'bell') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(440, now + 1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 1);
                osc.start(now);
                osc.stop(now + 1);
            } else if (type === 'zen') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(110, now);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 3);
                osc.start(now);
                osc.stop(now + 3);
            } else if (type === 'pulse') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(880, now + 0.1);
                osc.frequency.setValueAtTime(440, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.setValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'chirp') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1500, now);
                osc.frequency.exponentialRampToValueAtTime(3000, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(1500, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else { // classic
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            applyTheme(target);
            localStorage.setItem('pomodoroTheme', target);
        }

        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            document.getElementById('theme-btn').innerHTML = `<i data-lucide="${theme === 'dark' ? 'sun' : 'moon'}"></i>`;
            lucide.createIcons();
        }

        function loadTheme() {
            const theme = localStorage.getItem('pomodoroTheme') || 'dark';
            applyTheme(theme);
        }

        function toggleSettings() { const s = document.getElementById('settings-overlay'); s.style.display = s.style.display === 'flex' ? 'none' : 'flex'; }

        function saveSettings() {
            settings.pomodoro = parseInt(document.getElementById('input-pomodoro').value);
            settings.shortBreak = parseInt(document.getElementById('input-short').value);
            settings.longBreak = parseInt(document.getElementById('input-long').value);
            settings.sound = document.getElementById('select-sound').value;
            settings.bgImage = document.getElementById('input-bg').value;
            settings.overlay = document.getElementById('input-overlay').value;

            localStorage.setItem('pomodoroSettings', JSON.stringify(settings));
            applyVisualSettings();
            toggleSettings();
            resetTimer();
        }

        function applyVisualSettings() {
            if (settings.bgImage) {
                root.style.setProperty('--bg-image', `url(${settings.bgImage})`);
                root.style.setProperty('--bg-overlay', settings.overlay / 100);
            } else {
                root.style.setProperty('--bg-image', 'none');
                root.style.setProperty('--bg-overlay', '0');
            }
        }

        function loadSettings() {
            const s = localStorage.getItem('pomodoroSettings');
            if (s) {
                Object.assign(settings, JSON.parse(s));
                document.getElementById('input-pomodoro').value = settings.pomodoro;
                document.getElementById('input-short').value = settings.shortBreak;
                document.getElementById('input-long').value = settings.longBreak;
                document.getElementById('select-sound').value = settings.sound || 'bell';
                document.getElementById('input-bg').value = settings.bgImage || '';
                document.getElementById('input-overlay').value = settings.overlay || 0;
            }
        }

        document.addEventListener('mousemove', e => {
            root.style.setProperty('--mouse-x', `${(e.clientX / innerWidth) * 100}%`);
            root.style.setProperty('--mouse-y', `${(e.clientY / innerHeight) * 100}%`);
        });

        init();
    </script>
</body>

</html>
